    <!-- Web fonts are loaded WITHOUT blocking the first paint.
         They used to be an @import at the top of index.css, which makes the
         stylesheet — and therefore the whole page — wait on fonts.googleapis.com
         before anything is drawn. A visitor on a slow network, or one where
         that host is throttled or unreachable, stared at a blank page for
         several seconds before a single chapter appeared. Now the page renders
         immediately in the system font and the web font swaps in when it
         arrives (display=swap), so new chapters are visible from the very
         first paint. -->
